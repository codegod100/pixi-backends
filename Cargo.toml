[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.90"

[workspace.dependencies]
async-trait = "0.1.86"
fs-err = { version = "3.1.0" }
indexmap = "2.10.0"
insta = "1.42.1"
miette = { version = "7.6.0" }
minijinja = "2.24.0"
once_cell = "1.20.3"
rstest = "0.27.0"
serde = "1.0.218"
serde_json = "1.0.139"
serde_yaml = "0.9.34"
tempfile = "3.17.1"
thiserror = "2.0.12"
tokio = "1.43.0"

rattler_conda_types = { version = "0.55", default-features = false, features = ["rayon"] }
rattler_digest = { version = "2.0", default-features = false }
rattler_build_jinja = { version = "0.1.14" }
rattler_build_recipe = { version = "0.1.14" }
rattler_build_types = { version = "0.1.13" }

# The backend framework lives in the pixi monorepo; pin the commit these
# backends were developed and tested against.
pixi_build_backend = { git = "https://github.com/prefix-dev/pixi", rev = "22c8af58b3068292bdad7e995482495fa26f8691", default-features = false }
pixi_build_types = { git = "https://github.com/prefix-dev/pixi", rev = "22c8af58b3068292bdad7e995482495fa26f8691" }

# Same patches as the pixi workspace, so dependency resolution matches it.
[patch.crates-io]
version-ranges = { git = "https://github.com/astral-sh/pubgrub", rev = "d8efd77673c9a90792da9da31b6c0da7ea8a324b" }
reqwest-middleware = { git = "https://github.com/prefix-dev/pixi", rev = "22c8af58b3068292bdad7e995482495fa26f8691" }

[profile.dev.package."*"]
debug = false
