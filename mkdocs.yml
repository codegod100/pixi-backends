site_name: pixi-build extra backends
site_description: Nim and Flutter build backends for pixi
site_url: https://codegod100.github.io/pixi-backends/
repo_url: https://github.com/codegod100/pixi-backends
repo_name: codegod100/pixi-backends
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.instant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Backends:
      - Nim: backends/nim.md
      - Nim (native): backends/nim-native.md
      - Flutter and Dart: backends/flutter.md
  - Samples: samples.md
