[package]
name = "pixi-build-flutter"
version = "0.1.0"
edition.workspace = true
description = "Flutter and Dart build backend for Pixi"
license.workspace = true

[package.metadata.dist]
dist = false

[dependencies]
async-trait = { workspace = true }
fs-err = { workspace = true }
indexmap = { workspace = true }
miette = { workspace = true }
minijinja = { workspace = true }
once_cell = { workspace = true }
rattler_conda_types = { workspace = true }
rattler_digest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"] }

pixi_build_backend = { workspace = true }
pixi_build_types = { workspace = true }

rattler_build_recipe = { workspace = true }

[dev-dependencies]
insta = { workspace = true, features = ["filters", "redactions", "yaml"] }
rstest = { workspace = true }
tempfile = { workspace = true }

[features]
default = ["rustls"]
native-tls = ["pixi_build_backend/native-tls"]
rustls = ["pixi_build_backend/rustls"]
